# Built-in H2 database: the server runs out of the box, no MySQL installation or password needed.
# The database is created and filled with sample data every time the server starts.
hibernate.dialect = org.hibernate.dialect.H2Dialect
hibernate.connection.driver_class = org.h2.Driver
hibernate.show-sql = false

hibernate.hbm2ddl.auto = create

hibernate.connection.url = jdbc:h2:mem:cinema;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=DATE,VALUE,YEAR,MONTH,DAY,USER,KEY,LENGTH,POSITION

hibernate.connection.username = sa
hibernate.connection.password =
